spring.datasource.url=jdbc:h2:mem:arohan;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop

arohan.jwt.secret=test-secret-that-is-at-least-thirty-two-bytes-long
arohan.jwt.access-token-ttl=30m
arohan.jwt.issuer=arohan-test
arohan.cors.allowed-origins=http://localhost:5173
arohan.cors.allowed-origin-patterns=https://arohan-frontend-*.vercel.app
