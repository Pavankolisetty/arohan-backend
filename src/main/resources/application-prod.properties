# Cloud deployment profile. Required secrets intentionally have no defaults so a
# misconfigured deployment fails closed instead of using local credentials.
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

arohan.jwt.secret=${JWT_SECRET}
arohan.cors.allowed-origin=${FRONTEND_ORIGIN}

management.endpoint.health.probes.enabled=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

