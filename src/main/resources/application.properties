spring.application.name=arohan-api
server.port=${SERVER_PORT:8081}

# Local MySQL 8 configuration. Override any value with the environment variable
# shown inside ${...}; never commit a real production password.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/arohan?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:arohan_app}
spring.datasource.password=${DB_PASSWORD:arohan_local}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema. Hibernate validates that entities and migrations agree.
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info

arohan.jwt.secret=${JWT_SECRET:arohan-local-only-secret-change-before-production-2026}
arohan.jwt.access-token-ttl=30m
arohan.jwt.issuer=arohan-api
arohan.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

springdoc.swagger-ui.operations-sorter=method
